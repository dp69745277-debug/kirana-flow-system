<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="awningLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="awningDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#044E39"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#022C22" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Store/Godown Main Container with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Godown / Store Roof Triangle -->
    <path d="M120 200 L256 108 L392 200 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Roof peak accent flag/symbol -->
    <circle cx="256" cy="108" r="14" fill="url(#accentGold)"/>

    <!-- Awning Waves / Canopy -->
    <!-- Segment 1: White -->
    <path d="M120 200 L165 200 L165 242 Q142.5 258 120 242 Z" fill="url(#awningLight)"/>
    <!-- Segment 2: Emerald Dark -->
    <path d="M165 200 L211 200 L211 242 Q188 258 165 242 Z" fill="url(#awningDark)"/>
    <!-- Segment 3: White -->
    <path d="M211 200 L256 200 L256 242 Q233.5 258 211 242 Z" fill="url(#awningLight)"/>
    <!-- Segment 4: Emerald Dark -->
    <path d="M256 200 L301 200 L301 242 Q278.5 258 256 242 Z" fill="url(#awningDark)"/>
    <!-- Segment 5: White -->
    <path d="M301 200 L347 200 L347 242 Q324 258 301 242 Z" fill="url(#awningLight)"/>
    <!-- Segment 6: Emerald Dark -->
    <path d="M347 200 L392 200 L392 242 Q369.5 258 347 242 Z" fill="url(#awningDark)"/>

    <!-- Store Base Building -->
    <rect x="136" y="244" width="240" height="152" rx="12" fill="#FFFFFF"/>

    <!-- Left Pillar & Right Pillar -->
    <rect x="150" y="248" width="24" height="142" rx="4" fill="#E2E8F0"/>
    <rect x="338" y="248" width="24" height="142" rx="4" fill="#E2E8F0"/>

    <!-- Center Store Door / Counter Arch -->
    <path d="M196 390 L196 296 Q256 270 316 296 L316 390 Z" fill="#047857"/>

    <!-- Kirana Grocery Bag / Rupee Icon in Doorway -->
    <!-- Bag Body -->
    <path d="M228 322 L284 322 L278 376 L234 376 Z" fill="url(#accentGold)"/>
    <!-- Bag Handle -->
    <path d="M242 322 Q242 304 256 304 Q270 304 270 322" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Rupee / Tick mark inside Bag -->
    <path d="M249 336 L263 336 M249 344 L263 344 M249 336 Q259 346 249 356 L263 368" fill="none" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Base Plinth -->
    <rect x="120" y="390" width="272" height="18" rx="8" fill="#F1F5F9"/>
  </g>
</svg>
